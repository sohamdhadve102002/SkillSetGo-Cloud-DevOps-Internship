<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>Something Went Wrong</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      --bg: #08090d;
      --card: rgba(18, 20, 28, 0.72);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f7f7fb;
      --muted: #989baa;
      --accent: #7c5cff;
      --accent-2: #a855f7;
      --danger: #ff5c7a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(124, 92, 255, 0.20), transparent 38%),
        radial-gradient(circle at 10% 90%, rgba(168, 85, 247, 0.10), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    .wrapper {
      width: min(92%, 620px);
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
    }

    .icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      position: relative;
      background: linear-gradient(
        145deg,
        rgba(255, 92, 122, .18),
        rgba(124, 92, 255, .14)
      );
      border: 1px solid rgba(255, 255, 255, .10);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, .35),
        inset 0 1px rgba(255,255,255,.08);
    }

    .icon::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 34px;
      background: rgba(124, 92, 255, .12);
      filter: blur(24px);
      z-index: -1;
    }

    .icon svg {
      width: 42px;
      height: 42px;
      stroke: #fff;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: .9;
      font-weight: 800;
      letter-spacing: -0.09em;
      background: linear-gradient(135deg, #fff 10%, #a9a3ff 45%, #7c5cff 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 18px 35px rgba(124, 92, 255, .18));
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(1.7rem, 5vw, 2.45rem);
      letter-spacing: -0.04em;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .description {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .card {
      margin: 30px auto 0;
      padding: 8px;
      width: min(100%, 470px);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, .35),
        inset 0 1px rgba(255,255,255,.035);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button,
    a {
      height: 52px;
      border: 0;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font: inherit;
      font-weight: 600;
      font-size: .94rem;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .primary {
      color: white;
      background: linear-gradient(135deg, #7c5cff, #6844e8);
      box-shadow: 0 10px 25px rgba(124, 92, 255, .25);
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(124, 92, 255, .35);
    }

    .secondary {
      color: #dddde6;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
    }

    .secondary:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.13);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #a99bff;
      outline-offset: 3px;
    }

    .footer {
      margin-top: 26px;
      color: #626575;
      font-size: .78rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      color: #8f92a2;
      font-size: .78rem;
      font-weight: 500;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 14px rgba(255,92,122,.65);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        margin-bottom: 22px;
      }

      .icon svg {
        width: 34px;
        height: 34px;
      }

      .description {
        font-size: .92rem;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .card {
        margin-top: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wrapper {
        animation: none;
      }

      button,
      a {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="wrapper">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L2.8 19a1.5 1.5 0 0 0 1.3 2.2h15.8a1.5 1.5 0 0 0 1.3-2.2L12 3z"/>
        <path d="M12 9v4"/>
        <path d="M12 17h.01"/>
      </svg>
    </div>

    <div class="status">
      <span class="dot"></span>
      Page not found
    </div>

    <div class="code">404</div>

    <h1>Page Not Found.</h1>

    <p class="description">
      We couldn't complete your request right now.
      Please try again in a moment. If the problem continues,
      return to the homepage and start fresh.
    </p>

    <div class="card">
      <div class="actions">
        <button class="primary" onclick="location.reload()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 11a8.1 8.1 0 0 0-15.5-2"/>
            <path d="M4 4v5h5"/>
            <path d="M4 13a8.1 8.1 0 0 0 15.5 2"/>
            <path d="M20 20v-5h-5"/>
          </svg>
          Try again
        </button>

        <a class="secondary" href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M3 11.5L12 4l9 7.5"/>
            <path d="M5.5 10v9h13v-9"/>
            <path d="M9.5 19v-5h5v5"/>
          </svg>
          Go home
        </a>
      </div>
    </div>

    <div class="footer">
      Error 404 · Page Not Found
    </div>
  </main>
</body>
</html>
